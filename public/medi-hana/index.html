<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medi Hana AI Consultation | VR MEDI TOUR & HOME</title>
  <meta name="description" content="Medi Hana helps international patients prepare Korea medical travel inquiries. Not a hospital. No diagnosis. Human-reviewed coordination." />
  <link rel="canonical" href="https://vr-meditour.com/medi-hana/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Medi Hana AI Consultation | VR MEDI TOUR & HOME" />
  <meta property="og:description" content="Secure medical tourism pre-consultation assistant with multilingual coordination support." />
  <meta property="og:url" content="https://vr-meditour.com/medi-hana/" />
  <meta property="og:image" content="https://vr-meditour.com/assets/hero-medical-travel.jpg" />
  <link rel="stylesheet" href="/public/medi-hana/styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="/" class="logo">VR MEDI TOUR &amp; HOME</a>
    <nav>
      <a href="/" data-i18n="home">홈으로</a>
      <a href="/#consult-form" data-i18n="consult">상담 신청</a>
      <a href="/ai-skin/" data-i18n="skin">AI 피부 분석</a>
    </nav>
    <div class="lang-switch" id="langSwitch" aria-label="Language selector"></div>
  </header>

  <main class="container">
    <section class="hero card">
      <h1 data-i18n="title"></h1>
      <p data-i18n="subtitle"></p>
      <p class="notice" data-i18n="noticeShort"></p>
    </section>

    <p class="legal" data-i18n="legal"></p>

    <section class="chat-layout">
      <section class="card main-chat">
        <div id="chatMessages" class="messages" aria-live="polite"></div>
        <form id="chatForm" class="input-wrap">
          <label for="chatInput" class="sr-only">Message</label>
          <textarea id="chatInput" data-i18n-placeholder="placeholder" aria-label="Chat message input"></textarea>
          <button type="submit" aria-label="Send message" data-i18n="send"></button>
        </form>
        <p class="legal" data-i18n="legal"></p>
      </section>

      <aside class="side-stack">
        <section class="card profile">
          <img src="/public/assets/medi-hana/medi-hana-default.png" alt="Medi Hana" />
          <h2>Medi Hana</h2>
          <p data-i18n="profile"></p>
        </section>

        <section class="card summary">
          <h3 data-i18n="summaryTitle"></h3>
          <p class="summary-desc" data-i18n="summaryDesc"></p>
          <dl id="summaryFields"></dl>
          <div class="consent">
            <p data-i18n="consentText"></p>
            <label><input type="checkbox" id="consent1" /> <span data-i18n="consent1"></span></label>
            <label><input type="checkbox" id="consent2" /> <span data-i18n="consent2"></span></label>
          </div>
          <p class="legal" data-i18n="legal"></p>
          <div class="summary-actions">
            <button id="submitLead" disabled data-i18n="submit"></button>
            <div class="secondary-actions">
              <a class="btn" href="/#consult-form" data-i18n="toForm"></a>
              <button id="copyBtn" data-i18n="copy"></button>
              <button id="resetBtn" data-i18n="reset"></button>
            </div>
          </div>
          <a id="advancedLink" class="btn" href="https://chatgpt.com/g/g-68f04d401e488191b5afaed323a7b714-vr-medi-tour-home-korean-medical-tourism-gpt" target="_blank" rel="noopener noreferrer" data-i18n="advancedBtn" aria-label=""></a>
          <p class="sub-desc" data-i18n="advancedDesc"></p>
        </section>
      </aside>
    </section>

    <form name="medical-consult" method="POST" action="/thank-you.html" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="medical-consult" />
      <input type="hidden" name="medi_hana_mode" id="lead_mode" value="ai_chat" />
      <input type="hidden" name="medi_hana_summary" id="lead_summary" />
      <input type="hidden" name="medi_hana_transcript" id="lead_transcript" />
      <input type="hidden" name="inquiry_type" id="lead_inquiry_type" />
      <input type="hidden" name="preferred_language" id="lead_language" />
      <input type="hidden" name="interested_field" id="lead_field" />
      <input type="hidden" name="country" id="lead_country" />
      <input type="hidden" name="currentLocation" id="lead_location" />
      <input type="hidden" name="support_needed" id="lead_support" />
      <input type="hidden" name="privacy_agreement" id="lead_privacy" />
      <button type="submit" id="realSubmit">submit</button>
    </form>
  </main>

  <script src="/public/medi-hana/script.js"></script>
</body>
</html>
