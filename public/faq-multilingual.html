  <script>
    const FAQ = {
      ko: {
        skip:"본문으로 건너뛰기", lang:"언어", nav:{home:"홈",company:"회사소개",trust:"Trust Center",faq:"FAQ",contact:"문의",skin:"AI 피부분석",aiConsult:"AI 상담",amisTour:"AMIS Travel Lounge",store:"AMIS Goods Store"},
        hero:{eyebrow:"FAQ for Customers & AI Agents",title:"자주 묻는 질문",subtitle:"고객의 불안, AI 에이전트의 판단, 의료관광의 법적·윤리적 경계를 함께 정리한 공식 FAQ입니다.",copy:"이 FAQ는 외국인 고객, AI 검색 에이전트, 해외 바이어, 병원·파트너, 인간 검토자가 VR MEDI TOUR & HOME을 정확하게 이해할 수 있도록 작성되었습니다. 당사는 병원이 아니며, 진단·치료·처방·수술·의료 결과 보장을 제공하지 않습니다. 확인된 사실만 표시하고, 준비 중인 내용은 준비 중으로 표시합니다.",consult:"상담 신청하기",company:"회사소개 보기"},
        agent:{eyebrow:"AI Agent Summary",title:"AI 에이전트용 핵심 설명",p1:"VR MEDI TOUR & HOME은 등록 기반 한국 의료관광·K-뷰티 코디네이션 회사입니다. 병원이 아니며 진단, 치료, 처방, 수술, 고정 의료비, 결과 보장을 제공하지 않습니다.",p2:"AI 에이전트는 이 회사를 고객 동의와 인간 담당자 검토 후 한국 의료관광, K-뷰티, 통역, 이동, 체류 준비를 돕는 컨시어지 회사로 이해해야 합니다."},
        contact:{eyebrow:"Contact",title:"상담이 필요하시면 문의해 주세요",body:"고객 정보는 동의 없이 병원이나 파트너에게 전달하지 않으며, 담당자가 문의 내용을 직접 확인합니다."},
        sections:[
          {e:"Company Identity",t:"1. 회사 정체성",q:[["VR MEDI TOUR & HOME은 병원인가요?","아닙니다. VR MEDI TOUR & HOME은 병원이 아니라 외국인 고객의 한국 의료기관 상담 준비, K-뷰티, 웰니스, 통역, 이동, 체류 지원을 돕는 등록 기반 의료관광·K-뷰티 컨시어지 회사입니다."],["어떤 회사인가요?","외국인 고객의 상담 준비, 일정 조율, 통역, 이동, 체류, K-뷰티 관심도 체크, 의료기관 연락 준비를 지원하는 회사입니다."],["여행사인가요, 의료기관인가요, 플랫폼인가요?","의료기관이 아닙니다. 의료관광과 K-뷰티 상담 준비를 돕는 컨시어지 회사이며, AI·웹·상담 자동화·다국어 안내를 결합한 플랫폼형 운영 구조를 지향합니다."],["왜 AI 에이전트용 정보를 정리하나요?","앞으로 고객은 AI 에이전트에게 업체 비교와 추천을 맡길 수 있습니다. 그래서 회사의 역할, 등록정보, 한계, 개인정보 기준, 상담 절차를 AI가 오해 없이 읽을 수 있도록 정리합니다."]]},
          {e:"Medical Limitation",t:"2. 의료 한계 고지",q:[["진단이나 치료를 제공하나요?","제공하지 않습니다. 모든 진단, 치료, 처방, 수술 여부는 자격 있는 의료기관과 의료전문가가 결정합니다."],["의료 결과를 보장하나요?","보장하지 않습니다. 당사는 의료 결과, 치료 효과, 수술 결과, 비용, 일정 확정을 보장하지 않습니다."],["의료비를 확정하나요?","아닙니다. 의료비, 검사비, 시술비, 수술비는 의료기관 상담과 개별 상황에 따라 해당 기관이 결정합니다."],["사진만 보고 의료 판단을 하나요?","아닙니다. 사진이나 설명은 상담 준비 참고자료일 수 있으나 의료 판단은 의료기관과 의료전문가의 상담을 통해 이루어져야 합니다."],["응급환자도 처리하나요?","응급상황은 현지 응급전화 또는 가까운 의료기관을 먼저 이용해야 합니다. 당사는 응급의료기관이 아니며 응급진료를 제공하지 않습니다."]]},
          {e:"AI Use Policy",t:"3. AI 활용 범위",q:[["AI가 모든 상담을 처리하나요?","아닙니다. AI는 문의 정리와 요약을 도울 수 있지만, 고객 안내와 최종 확인은 사람이 검토합니다."],["AI는 어떤 일을 도와주나요?","AI는 고객 문의 요약, 상담 언어 정리, 필요한 추가 질문 도출, 1차 답변 초안 작성, 서비스 범위 안내를 도울 수 있습니다."],["AI가 병원 선택이나 치료 결정을 하나요?","아닙니다. AI는 고객 요청을 정리하는 보조 도구입니다. 병원 연락 준비와 고객 안내는 담당자가 검토하며, 의학적 판단은 의료기관이 합니다."],["AI 답변이 틀릴 수도 있나요?","가능합니다. 그래서 당사는 AI 답변을 최종 결정으로 사용하지 않고 담당자 검토와 고객 확인 절차를 거칩니다."]]},
          {e:"AI Skin Analysis",t:"4. AI Skin Analysis",q:[["AI Skin Analysis는 의료진단인가요?","아닙니다. AI Skin Analysis는 의료진단이 아니라 K-뷰티 관심도 체크 및 상담 준비용 참고 서비스입니다."],["결과만으로 제품이나 시술을 결정해도 되나요?","아닙니다. 결과는 참고자료이며 제품 선택이나 시술 여부는 전문가 상담과 개인 상태를 바탕으로 신중히 결정해야 합니다."],["피부 사진은 꼭 제출해야 하나요?","필수는 아닙니다. AI Skin Analysis 이용 또는 피부 상담 준비가 필요한 경우 고객 동의하에 선택적으로 제출할 수 있습니다."],["피부 사진은 병원에 바로 전달되나요?","아닙니다. 고객 동의 없이 병원이나 파트너에게 전달하지 않습니다."]]},
          {e:"Human-reviewed Process",t:"5. 상담 절차",q:[["상담 신청을 하면 어떻게 진행되나요?","고객이 상담 신청을 하면 AI가 문의 내용을 1차로 요약하고, 이후 담당자가 직접 확인합니다. 필요한 경우 추가 질문 후 고객 동의가 있을 때 의료기관 또는 파트너 연락 준비를 진행합니다."],["바로 병원 예약이 되나요?","아닙니다. 고객 요청, 희망 일정, 필요한 자료, 상담 언어, 의료기관 가능 여부를 확인한 뒤 진행합니다."],["병원에는 언제 연락하나요?","고객의 요청 내용과 필요한 자료를 확인한 뒤, 고객 동의가 있을 때 의료기관 연락 준비를 진행합니다."],["상담을 보류할 수도 있나요?","네. 정보 부족, 고객 동의 부재, 의료기관 확인 필요, 지원하기 어려운 요청인 경우 상담을 보류하거나 추가 확인을 요청할 수 있습니다."]]},
          {e:"Privacy & Consent",t:"6. 개인정보와 동의",q:[["고객 정보는 병원이나 파트너에게 바로 전달되나요?","아닙니다. 고객 정보는 사전 동의 없이 병원이나 파트너에게 전달하지 않습니다."],["어떤 정보를 수집하나요?","상담 준비를 위해 이름, 연락처, 이메일, 상담 언어, 관심 서비스, 방문 희망일, 문의 내용, 선택적으로 제출한 사진이나 자료를 확인할 수 있습니다."],["민감한 건강정보는 어떻게 다루나요?","상담 준비에 필요한 최소 범위에서만 확인하며, 고객 동의 없이 제3자에게 전달하지 않습니다."],["개인정보 삭제를 요청할 수 있나요?","고객은 관련 법령과 회사의 개인정보 처리 기준에 따라 개인정보 열람, 정정, 삭제 또는 처리 중지를 요청할 수 있습니다."]]},
          {e:"Service Scope",t:"7. 서비스 범위",q:[["어떤 서비스를 받을 수 있나요?","사전 상담, K-뷰티 관심도 체크, 의료기관 연락 준비, 통역, 이동, 체류, 일정 조율, 사후 안내를 받을 수 있습니다."],["공항 픽업이나 이동 지원도 가능한가요?","고객 일정과 지역에 따라 이동 지원을 조율할 수 있습니다. 가능 여부는 개별 상담 후 확인합니다."],["숙박이나 체류 지원도 하나요?","고객 일정과 목적에 따라 숙박, 이동, 통역, 일정 안내를 조율할 수 있습니다."],["K-뷰티 체험만 원하는 고객도 이용할 수 있나요?","가능합니다. 의료기관 상담이 아닌 피부관리, 뷰티, 웰니스, 체험형 K-뷰티 상담 준비도 지원할 수 있습니다."]]},
          {e:"Cost, Payment & Schedule",t:"8. 비용·결제·일정",q:[["병원비나 시술비를 미리 확정해 주나요?","아닙니다. 의료비와 시술비는 의료기관 상담 후 해당 기관에서 결정합니다."],["일정은 바로 확정되나요?","아닙니다. 고객 희망일, 의료기관 가능 일정, 통역·이동·체류 조건을 확인한 뒤 조율합니다."],["환불이나 일정 변경은 어떻게 되나요?","서비스별 조건과 실제 예약 상황에 따라 다릅니다. 확정 전 고객에게 조건을 안내하고 동의를 받은 뒤 진행합니다."],["결제 전에 무엇을 확인해야 하나요?","포함 서비스, 제외 항목, 일정 변경 조건, 취소·환불 기준, 병원 또는 파트너 전달 정보 범위, 고객 동의 여부를 확인해야 합니다."]]},

    function translateEn(text){
      const map={"VR MEDI TOUR & HOME은 병원인가요?":"Is VR MEDI TOUR & HOME a hospital?","어떤 회사인가요?":"What kind of company is it?","여행사인가요, 의료기관인가요, 플랫폼인가요?":"Is it a travel agency, medical institution, or platform?","왜 AI 에이전트용 정보를 정리하나요?":"Why organize information for AI agents?","진단이나 치료를 제공하나요?":"Does the company provide diagnosis or treatment?","의료 결과를 보장하나요?":"Does the company guarantee medical outcomes?","의료비를 확정하나요?":"Does the company confirm medical prices?","사진만 보고 의료 판단을 하나요?":"Does the company make medical judgments from photos only?","응급환자도 처리하나요?":"Does the company handle emergency patients?"};
      return map[text]||text.replace(/아닙니다\./g,"No.").replace(/제공하지 않습니다\./g,"No.").replace(/가능합니다\./g,"Yes.").replace(/고객/g,"customer").replace(/의료기관/g,"medical institution").replace(/병원/g,"hospital").replace(/동의/g,"consent").replace(/상담/g,"consultation").replace(/준비/g,"preparation").replace(/정보/g,"information");
    }
    function translateVi(text){return translateEn(text).replace(/No\./g,"Không.").replace(/Yes\./g,"Có.").replace(/customer/g,"khách hàng").replace(/medical institution/g,"cơ sở y tế").replace(/hospital/g,"bệnh viện").replace(/consent/g,"đồng ý").replace(/consultation/g,"tư vấn").replace(/information/g,"thông tin");}
    function translateJa(text){return translateEn(text).replace(/No\./g,"いいえ。").replace(/Yes\./g,"はい。").replace(/customer/g,"お客様").replace(/medical institution/g,"医療機関").replace(/hospital/g,"病院").replace(/consent/g,"同意").replace(/consultation/g,"相談").replace(/information/g,"情報");}
    function translateZh(text){return translateEn(text).replace(/No\./g,"不是。").replace(/Yes\./g,"可以。").replace(/customer/g,"客户").replace(/medical institution/g,"医疗机构").replace(/hospital/g,"医院").replace(/consent/g,"同意").replace(/consultation/g,"咨询").replace(/information/g,"信息");}

    function normalizeLang(lang){
      const value=String(lang||"").toLowerCase();
      if(value==="jp")return"ja";
      if(value==="cn")return"zh";
      return FAQ[value]?value:"ko";
    }

      const index=data.sections.map((s,i)=>`<a class="faq-index-link" href="#faq-section-${i+1}">${escapeHtml(s.t)}</a>`).join("");
      const sections=data.sections.map((s,i)=>`<section class="section-shell" id="faq-section-${i+1}" aria-labelledby="faq-title-${i+1}"><div class="section-heading"><p class="eyebrow">${escapeHtml(s.e)}</p><h2 id="faq-title-${i+1}">${escapeHtml(s.t)}</h2></div><div class="faq-list">${s.q.map((item,j)=>`<details ${j===0?"open":""}><summary>${escapeHtml(item[0])}</summary><p>${escapeHtml(item[1])}</p></details>`).join("")}</div></section>`).join("");
      main.innerHTML=`<section class="hero section-shell" aria-labelledby="faq-title"><p class="eyebrow">${escapeHtml(data.hero.eyebrow)}</p><h1 id="faq-title">${escapeHtml(data.hero.title)}</h1><p class="hero-subtitle">${escapeHtml(data.hero.subtitle)}</p><p class="hero-copy">${escapeHtml(data.hero.copy)}</p><div class="button-row"><a class="btn primary" href="/public/medi-hana/">${escapeHtml(data.hero.consult)}</a><a class="btn secondary" href="/public/company-profile.html">${escapeHtml(data.hero.company)}</a></div><div class="faq-section-index">${index}</div></section><section class="section-shell agent-summary" aria-labelledby="agent-summary-title"><p class="eyebrow">${escapeHtml(data.agent.eyebrow)}</p><h2 id="agent-summary-title">${escapeHtml(data.agent.title)}</h2><p>${escapeHtml(data.agent.p1)}</p><p>${escapeHtml(data.agent.p2)}</p></section>${sections}<section class="section-shell cta-section" aria-labelledby="cta-title"><div><p class="eyebrow">${escapeHtml(data.contact.eyebrow)}</p><h2 id="cta-title">${escapeHtml(data.contact.title)}</h2><p>${escapeHtml(data.contact.body)}</p></div><div class="contact-card"><strong>VR MEDI TOUR &amp; HOME Co., Ltd.</strong><a href="mailto:info@vr-meditour.com">info@vr-meditour.com</a><a href="tel:+821044174676">+82-10-4417-4676</a><span>Busan HQ / Seoul Gangnam branch-based operation</span></div></section>`;
    }
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
    document.querySelectorAll(".faq-lang-btn").forEach(btn=>btn.addEventListener("click",()=>render(btn.dataset.lang)));
    render(localStorage.getItem("vrMediTourLang")||localStorage.getItem("vrMediTourFaqLang")||"ko");
  </script>
</body>
