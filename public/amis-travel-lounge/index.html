<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AMIS Travel Lounge | AI 관광 루트 추천</title>
  <meta name="description" content="AMIS Travel Lounge에서 여행 목적, 지역, 일정, 관심 카테고리 기반 AI 관광 루트 추천을 제공합니다." />
  <style>
    :root {
      color-scheme: dark;
      --bg: #07101f;
      --panel: #0d1a2f;
      --line: rgba(133, 231, 226, 0.24);
      --text: #e8f5ff;
      --muted: #a9bdd0;
      --cta: linear-gradient(135deg, #1dc7c0, #20a4ff);
      --danger: #ff5e7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Noto Sans KR", system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #102544, var(--bg) 55%);
    }
    .page { max-width: 1100px; margin: 0 auto; padding: 32px 18px 56px; }
    .hero, .panel {
      background: linear-gradient(150deg, rgba(18, 35, 64, 0.95), rgba(9, 20, 40, 0.95));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 20px 48px rgba(0,0,0,0.35);
      padding: 28px;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 3.3vw, 2.2rem); }
    .muted { color: var(--muted); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .full { grid-column: 1 / -1; }
    label { display:block; font-weight: 700; font-size: .95rem; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; border-radius: 12px; border: 1px solid rgba(149,202,231,.35);
      background: rgba(8, 18, 34, 0.86); color: #e9f4ff; padding: 12px 13px;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus, textarea:focus { border-color: #5de1d5; box-shadow: 0 0 0 3px rgba(93,225,213,.18); }
    .actions { display:flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .btn {
      border: 1px solid rgba(255,255,255,.18); color:#f3fdff; text-decoration:none;
      border-radius: 12px; padding: 11px 16px; font-weight: 700; cursor: pointer;
      background: rgba(255,255,255,.05);
    }
    .btn.primary { background: var(--cta); border: none; color: #001a20; }
    .btn:disabled { opacity: .6; cursor: wait; }
    .alert {
      border-radius: 14px; border: 1px solid rgba(255,94,122,.4); background: rgba(60, 15, 25, .6);
      color: #ffdbe3; padding: 12px 14px; margin-top: 12px;
    }
    .result-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin-top: 14px; }
    .route-card {
      border-radius: 16px; padding: 16px;
      background: rgba(178, 238, 255, 0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(138, 228, 239, .32);
    }
    .route-card h3 { margin: 0 0 8px; }
    .legal { font-size: .92rem; margin-top: 16px; line-height: 1.5; }
    @media (max-width: 840px) {
      .form-grid, .result-grid { grid-template-columns: 1fr; }
      .hero, .panel { padding: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>AMIS Travel Lounge AI 관광 루트 찾기</h1>
      <p class="muted">여행 목적, 지역, 일정, 관심 카테고리를 입력하면 안전한 참고용 루트를 안내합니다.</p>
    </section>

    <section class="panel" id="amis-tour-ai">
      <form id="amisTourForm" novalidate>
        <div class="form-grid">
          <div><label for="purpose">여행 목적</label><input id="purpose" name="purpose" required placeholder="예: K-POP 팬 관광" /></div>
          <div><label for="area">지역</label><input id="area" name="area" required placeholder="예: 부산아시아드주경기장" /></div>
          <div><label for="days">일정</label><input id="days" name="days" required placeholder="예: 2일" /></div>
          <div><label for="category">관심 카테고리</label><input id="category" name="category" required placeholder="예: K-뷰티와 야경" /></div>
          <div><label for="language">언어</label><select id="language" name="language"><option value="ko">한국어</option><option value="en">English</option><option value="vi">Tiếng Việt</option><option value="ja">日本語</option><option value="zh">中文</option></select></div>
          <div class="full"><label for="message">추가 요청사항</label><textarea id="message" name="message" rows="4" placeholder="예: 부산 공연 후 K-뷰티와 야경을 함께 보고 싶습니다."></textarea></div>
        </div>
        <div class="actions">
          <button type="submit" class="btn primary" id="amisSubmitBtn">AI 루트 추천 받기</button>
          <button type="button" class="btn" id="amisRetryBtn" hidden>다시 시도</button>
          <a class="btn" href="/#consult">상담 문의하기</a>
        </div>
      </form>
      <p id="amisStatus" class="muted" aria-live="polite"></p>
      <div id="amisError" class="alert" role="alert" hidden></div>
      <div id="amisResult" class="result-grid" hidden></div>

      <p class="legal muted">VR MEDI TOUR &amp; HOME은 병원이 아니며, 의료 진단·처방·치료를 제공하지 않습니다.<br/>의료관광 관련 내용은 사전상담이며, 실제 진료·예약·비용은 담당자와 관련 기관 확인 후 안내됩니다.</p>
    </section>
  </main>

  <script>
    (() => {
      const form = document.getElementById('amisTourForm');
      const statusEl = document.getElementById('amisStatus');
      const errorEl = document.getElementById('amisError');
      const resultEl = document.getElementById('amisResult');
      const retryBtn = document.getElementById('amisRetryBtn');
      const submitBtn = document.getElementById('amisSubmitBtn');

      const setLoading = (loading) => {
        submitBtn.disabled = loading;
        submitBtn.textContent = loading ? '생성 중...' : 'AI 루트 추천 받기';
        statusEl.textContent = loading ? 'AI 관광 루트를 생성 중입니다...' : '';
      };

      const renderResult = (data) => {
        const cards = (data.items || []).map((item) => `
          <article class="route-card">
            <h3>${item.day || ''} · ${item.spot_name || ''}</h3>
            <p><strong>지역</strong> ${item.area || ''}</p>
            <p>${item.description || ''}</p>
            <p><strong>추천 시간</strong> ${item.recommended_time || ''}</p>
            <p><strong>이동 방법</strong> ${item.transport || ''}</p>
            <p><strong>팁</strong> ${item.tip || ''}</p>
          </article>
        `).join('');

        resultEl.innerHTML = `
          <article class="route-card" style="grid-column:1/-1;">
            <h3>추천 루트 제목: ${data.title || '추천 관광 루트'}</h3>
            <p><strong>요약</strong> ${data.summary || ''}</p>
            <p><strong>주의 문구</strong> ${data.notice || ''}</p>
          </article>
          ${cards}
        `;
        resultEl.hidden = false;
      };

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.hidden = true;
        resultEl.hidden = true;
        retryBtn.hidden = true;
        setLoading(true);

        try {
          const payload = Object.fromEntries(new FormData(form).entries());
          const res = await fetch('/.netlify/functions/amis-tour-ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || 'route_failed');
          renderResult(data);
        } catch (_) {
          errorEl.textContent = '요청 처리 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.';
          errorEl.hidden = false;
          retryBtn.hidden = false;
        } finally {
          setLoading(false);
        }
      });

      retryBtn.addEventListener('click', () => form.requestSubmit());
    })();
  </script>
</body>
</html>
