<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AMIS Travel Lounge | AI 관광 루트 추천</title>
  <meta name="description" content="AMIS Travel Lounge에서 여행 목적, 지역, 일정, 관심 카테고리 기반 AI 관광 루트 추천을 제공합니다." />
  <link rel="stylesheet" href="/public/seo-landing.css" />
</head>
<body>
  <main class="page">
    <section class="section-card" id="amis-tour-ai">
      <h1>AMIS Travel Lounge AI 관광 루트 찾기</h1>
      <p class="muted">여행 목적, 지역, 일정, 관심 카테고리를 입력하면 참고용 관광 루트를 제안합니다.</p>
      <form id="amisTourForm" class="contact-form" novalidate>
        <label>여행 목적<input name="purpose" required placeholder="예: K-POP fan tour" /></label>
        <label>지역<input name="area" required placeholder="예: Busan Asiad Stadium" /></label>
        <label>일정<input name="days" required placeholder="예: 2 days" /></label>
        <label>관심 카테고리<input name="category" required placeholder="예: K-beauty and night view" /></label>
        <label>언어<select name="language"><option value="ko">한국어</option><option value="en">English</option><option value="vi">Tiếng Việt</option><option value="ja">日本語</option><option value="zh">中文</option></select></label>
        <label>추가 요청사항<textarea name="message" rows="4" placeholder="예: 부산 공연 후 K-뷰티와 야경을 함께 보고 싶습니다."></textarea></label>
        <div class="cta-row">
          <button type="submit" class="btn primary" id="amisSubmitBtn">AI 루트 추천 받기</button>
          <button type="button" class="btn secondary" id="amisRetryBtn" hidden>다시 시도</button>
          <a class="btn secondary" href="/#consult">상담 문의하기</a>
        </div>
      </form>
      <p id="amisStatus" class="muted" aria-live="polite"></p>
      <div id="amisError" class="muted" role="alert" hidden></div>
      <div id="amisResult" class="grid" hidden></div>
      <p class="muted">VR MEDI TOUR &amp; HOME is not a hospital and does not provide diagnosis, prescription, or medical treatment. Medical decisions are made only by licensed medical professionals at partner medical institutions.</p>
    </section>
  </main>

  <script>
    (() => {
      const form = document.getElementById('amisTourForm');
      const statusEl = document.getElementById('amisStatus');
      const errorEl = document.getElementById('amisError');
      const resultEl = document.getElementById('amisResult');
      const retryBtn = document.getElementById('amisRetryBtn');
      const submitBtn = document.getElementById('amisSubmitBtn');

      const setLoading = (loading) => {
        submitBtn.disabled = loading;
        statusEl.textContent = loading ? 'AI 관광 루트를 생성 중입니다...' : '';
      };

      const renderResult = (data) => {
        const cards = (data.items || []).map((item) => `
          <article class="card">
            <h3>${item.day || ''} · ${item.spot_name || ''}</h3>
            <p><strong>${item.area || ''}</strong></p>
            <p>${item.description || ''}</p>
            <p><b>권장 시간</b> ${item.recommended_time || ''}</p>
            <p><b>이동</b> ${item.transport || ''}</p>
            <p><b>팁</b> ${item.tip || ''}</p>
          </article>
        `).join('');
        resultEl.innerHTML = `<article class="card"><h3>${data.title || '추천 관광 루트'}</h3><p>${data.summary || ''}</p><p class="muted">${data.notice || ''}</p></article>${cards}`;
        resultEl.hidden = false;
      };

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.hidden = true;
        resultEl.hidden = true;
        retryBtn.hidden = true;
        const payload = Object.fromEntries(new FormData(form).entries());
        setLoading(true);
        try {
          const res = await fetch('/.netlify/functions/amis-tour-ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error('route_failed');
          renderResult(data);
        } catch (_) {
          errorEl.textContent = '요청 처리 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.';
          errorEl.hidden = false;
          retryBtn.hidden = false;
        } finally {
          setLoading(false);
        }
      });

      retryBtn.addEventListener('click', () => form.requestSubmit());
    })();
  </script>
</body>
</html>
