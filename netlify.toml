[build]
  publish = "."
  functions = "netlify/functions"

  
[functions]
included_files = ["public/medical-mydata-ai/**"]
# Language button images are stored under /public/assets in the repository, while
# page markup intentionally references the public URL path /assets/images/language/*.
[[redirects]]
  from = "/assets/images/language/*"
  to = "/public/assets/images/language/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/assets/images/tours/*"
  to = "/public/assets/images/tours/:splat"
  status = 200
  force = true

# AI Skin is served as real static files from /ai-skin/ because publish = ".".
# Keep this path free of redirects to avoid Deploy Preview redirect loops.
[[redirects]]
  from = "/campus-agent"
  to = "/public/campus-agent/"
  status = 301

[[redirects]]
  from = "/campus-agent/*"
  to = "/public/campus-agent/:splat"
  status = 200

# The production publish directory is the repository root (publish = ".").
# Company profile source files live under /public per project convention, so these
# clean URL rewrites expose them at /company-profile.html and /company-profile.css.
[[redirects]]
  from = "/company-profile.html"
  to = "/public/company-profile.html"
  status = 200

[[redirects]]
  from = "/company-profile.css"
  to = "/public/company-profile.css"
  status = 200

[[redirects]]
  from = "/company-agent-trust.css"
  to = "/public/company-agent-trust.css"
  status = 200

[[redirects]]
  from = "/company-profile.js"
  to = "/public/company-profile.js"
  status = 200

# FAQ page source files live under /public and are exposed at root-level URLs.
[[redirects]]
  from = "/faq.html"
  to = "/public/faq.html"
  status = 200

[[redirects]]
  from = "/faq.css"
  to = "/public/faq.css"
  status = 200

[[redirects]]
  from = "/faq-i18n.js"
  to = "/public/faq-i18n.js"
  status = 200

# SEO landing pages stored under /public and exposed at root-level URLs.
[[redirects]]
  from = "/medical-travel-guide.html"
  to = "/public/medical-travel-guide.html"
  status = 200

[[redirects]]
  from = "/vietnam-korea-medical-tourism.html"
  to = "/public/vietnam-korea-medical-tourism.html"
