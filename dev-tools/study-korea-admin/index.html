<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>VR STUDENT KOREA — 관리자 UI 검토</title><link rel="stylesheet" href="admin.css"><script type="module" src="admin.mjs"></script></head>
<body><main><header><div><p>VR STUDENT KOREA · ADMIN PREVIEW</p><h1 data-ko="상담 관리 화면 검토" data-vi="Xem thử quản lý tư vấn"></h1></div><button id="language" type="button">Tiếng Việt</button></header>
<p class="notice" data-ko="개발 전용 모의 화면입니다. 로그인·권한 인증·실제 저장 기능이 없습니다. 가상 접수번호만 사용하며 새로고침하면 변경 내용이 사라집니다. 실제 개인정보를 입력하지 마세요." data-vi="Đây là bản mô phỏng dành cho phát triển, không có đăng nhập, xác thực quyền hay lưu trữ thực. Chỉ dùng mã yêu cầu giả; thay đổi mất khi tải lại. Không nhập dữ liệu cá nhân thật."></p>
<section class="filters"><label><span data-ko="모의 역할 (인증 아님)" data-vi="Vai trò mô phỏng (không phải xác thực)"></span><select id="actor"><option value="supervisor" data-ko="총괄 관리자" data-vi="Quản lý tổng"></option><option value="student-admin" data-ko="학생 상담 담당자" data-vi="Phụ trách sinh viên"></option><option value="partner-admin" data-ko="기관 협력 담당자" data-vi="Phụ trách hợp tác"></option><option value="anonymous" data-ko="권한 없음" data-vi="Không có quyền"></option></select></label><label><span data-ko="문의 유형" data-vi="Loại yêu cầu"></span><select id="kind"><option value="all" data-ko="전체" data-vi="Tất cả"></option><option value="student" data-ko="학생" data-vi="Sinh viên"></option><option value="partner" data-ko="기관" data-vi="Tổ chức"></option></select></label><label><span data-ko="상태 필터" data-vi="Lọc trạng thái"></span><select id="status-filter"></select></label></section>
<p id="count" role="status"></p><div id="records" class="records"></div>
<section class="audit"><h2 data-ko="모의 변경 기록" data-vi="Nhật ký thay đổi mô phỏng"></h2><ul id="audit"></ul></section><p id="feedback" role="status" aria-live="polite"></p>
<footer data-ko="상태·역할 명칭은 PRD 원문 확인 전 제안입니다. 운영 권한은 서버 인증·DB 정책으로 강제해야 합니다. 이 화면은 배포 산출물에서 제외됩니다." data-vi="Tên trạng thái và vai trò là đề xuất chờ đối chiếu PRD. Quyền thực tế phải được kiểm soát bằng xác thực máy chủ và chính sách DB. Trang này bị loại khỏi bản xuất bản."></footer></main></body></html>
